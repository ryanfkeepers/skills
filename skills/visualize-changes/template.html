<title>{{TITLE}}</title>
<style>
/* Layout: a design brief for a small meeting. Header, sticky agenda tabs, one topic visible at a time; type sized for a shared screen. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --sunken: #eef1f4;
  --ink: #18212b;
  --muted: #5a6776;
  --line: #d9dfe6;
  --accent: #0e6f7a;
  --accent-soft: #dff0f1;
  --add: #1d7a43;  --add-bg: #e5f4ea;
  --del: #b4281c;  --del-bg: #fce9e7;
  --mod: #8a5a00;  --mod-bg: #fbf0d4;
  --cont: #1f5fbf;
  --code-kw: #8a3ffc; --code-ty: #0e6f7a; --code-fn: #1f5fbf; --code-str: #1d7a43; --code-num: #a04c00; --code-com: #6b7785;
  /* the viewer's own monospace font for every role: whatever they read code in all day */
  --font-display: monospace;
  --font-body: monospace;
  --font-mono: monospace;
  /* state borders: same as the state color in light mode, dimmed in dark mode */
  --add-line: var(--add); --mod-line: var(--mod); --del-line: var(--del);
  --step--1: 0.875rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.75rem;
  --step-3: 2.375rem;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f14; --surface: #11161b; --sunken: #161c22; --ink: #d5cfc7; --muted: #bab0a4;
    --line: #776e62; --accent: #5fbfc9; --accent-soft: #163236;
    --add: #71df9a; --add-bg: #0f261a; --del: #ff8274; --del-bg: #3b1915; --mod: #faca5c; --mod-bg: #2a210a; --cont: #82aaff;
    --add-line: color-mix(in srgb, var(--add) 55%, var(--bg));
    --mod-line: color-mix(in srgb, var(--mod) 55%, var(--bg));
    --del-line: color-mix(in srgb, var(--del) 55%, var(--bg));
    --code-kw: #c49bff; --code-ty: #6cc7d1; --code-fn: #82aaff; --code-str: #8fd19e; --code-num: #f0a868; --code-com: #7b8794;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f14; --surface: #11161b; --sunken: #161c22; --ink: #d5cfc7; --muted: #bab0a4;
  --line: #776e62; --accent: #5fbfc9; --accent-soft: #163236;
  --add: #71df9a; --add-bg: #0f261a; --del: #ff8274; --del-bg: #3b1915; --mod: #faca5c; --mod-bg: #2a210a; --cont: #82aaff;
  --add-line: color-mix(in srgb, var(--add) 55%, var(--bg));
  --mod-line: color-mix(in srgb, var(--mod) 55%, var(--bg));
  --del-line: color-mix(in srgb, var(--del) 55%, var(--bg));
  --code-kw: #c49bff; --code-ty: #6cc7d1; --code-fn: #82aaff; --code-str: #8fd19e; --code-num: #f0a868; --code-com: #7b8794;
  color-scheme: dark;
}

/* Colorblind palettes: only the state colors change. Okabe-Ito / GitHub-style choices.
   rg = protanopia and deuteranopia (red-green): blue new, purple changed, orange removed.
   by = tritanopia (blue-yellow): blue new, amber changed, red removed. */
:root[data-palette="rg"] { --add: #0b63c4; --add-bg: #e3effc; --mod: #9c3d8c; --mod-bg: #f7e8f4; --del: #b8560c; --del-bg: #fcecdf; }
:root[data-palette="by"] { --add: #0969da; --add-bg: #e2eefc; --mod: #8a6100; --mod-bg: #fbf1d6; --del: #cf222e; --del-bg: #fde8ea; }
@media (prefers-color-scheme: dark) {
  :root[data-palette="rg"]:not([data-theme="light"]) { --add: #6cb2f5; --add-bg: #10263f; --mod: #e08fd0; --mod-bg: #35182f; --del: #f3a052; --del-bg: #3a2410; }
  :root[data-palette="by"]:not([data-theme="light"]) { --add: #58a6ff; --add-bg: #0f2541; --mod: #d4a72c; --mod-bg: #33290c; --del: #ff7b72; --del-bg: #3d1a1a; }
}
:root[data-palette="rg"][data-theme="dark"] { --add: #6cb2f5; --add-bg: #10263f; --mod: #e08fd0; --mod-bg: #35182f; --del: #f3a052; --del-bg: #3a2410; }
:root[data-palette="by"][data-theme="dark"] { --add: #58a6ff; --add-bg: #0f2541; --mod: #d4a72c; --mod-bg: #33290c; --del: #ff7b72; --del-bg: #3d1a1a; }

body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5; }
.vc { box-sizing: border-box; max-width: var(--vc-width, 1240px); margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
.vc *, .vc *::before, .vc *::after { box-sizing: border-box; }
.vc h1, .vc h2, .vc h3 { text-wrap: balance; margin: 0; }
.vc code, .vc .vc-mono { font-family: var(--font-mono); font-size: 0.92em; }

/* header */
.vc-head { display: grid; gap: 6px; padding-block-end: 20px; }
.vc-eyebrow { font-family: var(--font-mono); font-size: var(--step--1); color: var(--muted); overflow-wrap: anywhere; }
.vc-head h1 { font-family: var(--font-display); font-weight: 600; color: var(--ink); font-size: var(--step-3); line-height: 1.1; letter-spacing: -0.01em; }
.vc-titlebar { position: relative; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; }
/* popups anchor to the whole title row, so they stay on screen when the buttons wrap under a long title */
.vc-controls { position: static; }
.vc-icon-btn { display: inline-grid; place-items: center; width: 2rem; height: 2rem; padding: 0; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.vc-icon-btn:hover, .vc-icon-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.vc-icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.vc-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: min(300px, calc(100vw - 32px)); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); overflow: hidden; }
.vc-menu[hidden] { display: none; }
.vc-menu-head { display: grid; gap: 2px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.vc-menu-head strong { font-size: var(--step--1); font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; }
.vc-menu-head span { font-size: 0.8125rem; color: var(--muted); }
.vc-menu-list { display: grid; max-height: min(50vh, 340px); overflow-y: auto; padding: 4px; }
.vc-menu-list button { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 10px; font: inherit; font-size: var(--step--1);
  color: var(--ink); background: none; border: 0; border-radius: 4px; cursor: pointer; text-align: left; }
.vc-menu-list button:hover, .vc-menu-list button:focus-visible { background: var(--sunken); outline: none; }
.vc-menu-list button[aria-checked="true"] { color: var(--accent); font-weight: 600; }
.vc-menu-check { visibility: hidden; }
.vc-menu-list button[aria-checked="true"] .vc-menu-check { visibility: visible; }
.vc-legend-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: min(440px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto;
  padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }
.vc-legend-pop[hidden] { display: none; }
.vc-legend-pop section + section { margin-top: 12px; }
.vc-legend-pop h4 { margin: 0 0 6px; font-size: var(--step--1); font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.vc-legend-pop ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: var(--step--1); }
.vc-legend-pop li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 10px; align-items: center; }
.vc-key { display: inline-flex; align-items: center; }
.vc-key .sw { display: inline-block; width: 28px; height: 14px; border-radius: 3px; border: 2px solid var(--line); }
.vc-key .sw.add { border-color: var(--add-line); background: var(--add-bg); }
.vc-key .sw.mod { border-color: var(--mod-line); background: var(--mod-bg); }
.vc-key .sw.del { border-color: var(--del-line); border-style: dashed; }
.vc-key .sw.alt { border-style: dashed; background: transparent; }
.vc-key .sw.span { border-style: dotted; border-color: var(--mod-line); background: var(--mod-bg); }
.vc-key .sw-pill { width: 40px; height: 16px; padding: 0; border-radius: 999px; }
.vc-key .sw-dia { width: 28px; height: 16px; }
.vc-key .sw-dia polygon { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.vc-key .sw-glyph { font-size: 1.1rem; line-height: 1; color: var(--muted); }
.vc-key .sw-glyph.err { color: var(--del); } .vc-key .sw-glyph.warn { color: var(--mod); }
.vc-was-demo { position: relative; display: inline-block; width: 52px; height: 14px; margin-top: 7px; font-size: 0; border-top: 1px solid var(--mod-line); }
.vc-was-demo::before { content: "was"; position: absolute; top: -9px; left: 8px; padding: 0 6px; font-size: 0.75rem; font-weight: 600; line-height: 1.4; color: var(--mod); background: var(--surface); }
.vc-prefs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

/* tabs: radio inputs drive panels so the page works without JS */
.vc-radio { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
.vc-tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 2px; overflow-x: auto;
  background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; scrollbar-width: thin; }
.vc-tabs label { flex: none; cursor: pointer; padding: 11px 14px 10px; color: var(--muted); border-bottom: 2px solid transparent;
  font-weight: 500; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.vc-tabs label:hover { color: var(--ink); }
.vc-num { font-family: var(--font-mono); font-size: var(--step--1); color: var(--accent); }
.vc-tabs .vc-num { color: inherit; opacity: 0.7; }
.vc-panels { position: relative; overflow: clip; padding-block-start: 28px; }
.vc-panel { position: absolute; inset: 0 0 auto 0; visibility: hidden; pointer-events: none; }
.vc-panel > * + * { margin-block-start: 32px; }
{{TAB_CSS}}

/* shared type */
.vc-panel-head { display: grid; gap: 6px; }
.vc-panel-head h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--step-2); line-height: 1.15; }
.vc-lede { margin: 0; color: var(--muted); font-size: var(--step-1); }
.vc-h, .vc-block > h3.vc-h { font-size: var(--step--1); font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.vc-block { display: grid; gap: 12px; min-width: 0; }
.vc-block > h3 { font-size: var(--step-1); font-weight: 600; }
.vc-caption { margin: 0; color: var(--muted); font-size: var(--step--1); max-width: 80ch; }

/* overview */
.vc-summary { margin: 0; font-size: var(--step-1); line-height: 1.6; }
.vc-agenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.vc-agenda label { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline;
  padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
.vc-agenda label:hover { border-color: var(--accent); }
.vc-agenda .vc-num { font-size: var(--step-0); }
.vc-agenda strong { font-weight: 600; }
.vc-agenda .vc-agenda-lede { grid-column: 2 / -1; color: var(--muted); font-size: var(--step--1); }

/* where it lands: directory tree from the repo root */
.vc-tree-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; overflow-x: auto; }
.vc-tree, .vc-tree ul { list-style: none; margin: 0; padding: 0; }
.vc-tree ul { margin-inline-start: 9px; padding-inline-start: 16px; border-inline-start: 1px solid var(--line); }
.vc-tree li { padding-block: 2px; }
.vc-tree ul > li { position: relative; }
.vc-tree ul > li::before { content: ""; position: absolute; inset-inline-start: -16px; top: 0.85em; width: 12px; border-top: 1px solid var(--line); }
.vc-dir { font-family: var(--font-mono); font-size: var(--step--1); color: var(--ink); white-space: nowrap; }
.vc-toggle { cursor: pointer; user-select: none; }
.vc-toggle::before { content: "\25BE"; display: inline-block; width: 1em; color: var(--muted); }
.vc-tree li.collapsed > .vc-toggle::before { content: "\25B8"; }
.vc-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.vc-tree li.collapsed > ul { display: none; }
.vc-owner { margin-inline-start: 10px; font-size: var(--step--1); color: var(--accent); }
.vc-landed { display: block; margin: 1px 0 4px 2px; font-size: var(--step--1); color: var(--muted); white-space: normal; }
.vc-pkg { display: inline-block; font-family: var(--font-mono); font-size: var(--step--1); padding: 0 8px; border-radius: 4px; border: 1px solid var(--line);
  background: var(--sunken); color: var(--ink); white-space: nowrap; }
.vc-pkg.add { border-color: var(--add-line); background: var(--add-bg); color: var(--add); }
.vc-pkg.mod { border-color: var(--mod-line); background: var(--mod-bg); color: var(--mod); }
.vc-pkg.del { border-color: var(--del-line); border-style: dashed; color: var(--del); text-decoration: line-through; }
.vc-pkg.test, .vc-pkg.doc { color: var(--muted); border-style: dotted; background: none; }

/* pills */
.vc-pill, .vc-badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 0.8125rem; font-weight: 500; white-space: nowrap;
  background: var(--sunken); color: var(--muted); }
.vc-pill.add, .vc-badge.add { color: var(--add); background: var(--add-bg); }
.vc-pill.del, .vc-badge.del { color: var(--del); background: var(--del-bg); }
.vc-pill.mod, .vc-badge.mod { color: var(--mod); background: var(--mod-bg); }
.vc-badge.legacy { color: var(--muted); background: var(--sunken); }
.vc-badge.flag { color: var(--del); background: var(--del-bg); text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.75rem; }
.vc-kind { font-size: var(--step--1); color: var(--muted); }

/* before / after */
.vc-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.vc-compare > figure { margin: 0; min-width: 0; display: grid; gap: 6px; align-content: start; }
.vc-compare.vc-stacked { grid-template-columns: minmax(0, 1fr); }
.vc-tag { font-size: 0.8125rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
.vc-tag-before { color: var(--muted); }
.vc-tag-after { color: var(--accent); }
@media (max-width: 760px) { .vc-compare { grid-template-columns: minmax(0, 1fr); } }

/* diagrams */
.vc-diagram { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; overflow-x: auto; }
.vc-diagram pre.vc-mermaid { margin: 0; background: none; text-align: center; white-space: pre; color: var(--muted); font-family: var(--font-mono); }
.vc-diagram pre.vc-mermaid svg { max-width: 100%; height: auto; }
/* full-window view (diagrams and walkthroughs): click or Enter on a diagram, or the walkthrough's Fullscreen button; Escape closes */
.vc-diagram:has(svg) { cursor: zoom-in; }
.vc-diagram:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vc-fs { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); }
.vc-fs::backdrop { background: color-mix(in srgb, var(--bg) 92%, transparent); }
.vc-fs-frame { box-sizing: border-box; display: grid; grid-template-rows: auto minmax(0, 1fr); width: 100%; height: 100%; background: var(--bg); }
.vc-fs-bar { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px 24px; border-bottom: 1px solid var(--line); }
.vc-fs-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--step--1); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.vc-fs-bar label { font-size: var(--step--1); color: var(--muted); }
.vc-fs-bar select, .vc-fs-close { font: inherit; font-size: var(--step--1); height: 2rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 4px; padding: 0 10px; cursor: pointer; }
.vc-fs-bar select:focus-visible, .vc-fs-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.vc-fs-body { overflow: auto; padding: 24px; cursor: zoom-out; }
.vc-fs-content { width: var(--fs-width, 100%); margin-inline: auto; cursor: default; }
.vc-fs-content > svg { display: block; width: 100% !important; height: auto !important; max-width: none !important; }
.vc-mermaid-error { text-align: left !important; color: var(--del) !important; }

/* boundaries: exposed surface, one card per directory */
.vc-surface { display: grid; gap: 10px; }
.vc-surface > .vc-h { margin: 0; }
.vc-scard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.vc-scard-head { padding: 9px 16px; border-bottom: 1px solid var(--line); }
.vc-scard-head code { font-size: var(--step--1); color: var(--muted); }
.vc-srow { display: grid; grid-template-columns: 6.5em minmax(10em, 1.2fr) minmax(0, 4fr); gap: 4px 16px; align-items: start; padding: 10px 16px; }
.vc-srow + .vc-srow { border-top: 1px solid var(--line); }
.vc-srow > .vc-badge { justify-self: start; margin-top: 2px; }
.vc-skind { font-size: var(--step--1); color: var(--muted); padding-top: 2px; }
.vc-skind code { color: var(--ink); }
.vc-decl { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; min-width: 0; }
.vc-decl.vc-decl-multi { flex-direction: column; align-items: stretch; }
.vc-code { margin: 0; font-family: var(--font-mono); font-size: var(--step--1); line-height: 1.55; white-space: pre; overflow-x: auto;
  max-width: 100%; color: var(--ink); tab-size: 4; }
.vc-decl-multi .vc-code { padding: 8px 10px; background: var(--sunken); border-radius: 4px; }
.vc-code.vc-code-before { opacity: 0.75; }
.vc-code del { color: var(--del); background: var(--del-bg); text-decoration: line-through; border-radius: 2px; }
.vc-code ins { background: var(--add-bg); text-decoration: none; border-radius: 2px; box-shadow: inset 0 -2px 0 var(--add); }
.tk-kw { color: var(--code-kw); } .tk-ty { color: var(--code-ty); } .tk-fn { color: var(--code-fn); }
.tk-str { color: var(--code-str); } .tk-num { color: var(--code-num); } .tk-com { color: var(--code-com); font-style: italic; }
@media (max-width: 820px) { .vc-srow { grid-template-columns: auto minmax(0, 1fr); } .vc-srow > .vc-decl { grid-column: 1 / -1; } }

/* key decisions and failure models: one statement per row, with an optional state badge and "was" panel */
.vc-items { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.vc-item { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 4px 16px; align-items: start; padding: 12px 16px; }
.vc-item + .vc-item { border-top: 1px solid var(--line); }
.vc-item > .vc-badge { justify-self: start; margin-top: 2px; }
.vc-item-main { display: grid; gap: 3px; min-width: 0; }
.vc-item.del .vc-item-text { color: var(--muted); text-decoration: line-through; }
.vc-item-line { display: grid; grid-template-columns: 5ch minmax(0, 1fr); column-gap: 0.6em; }
.vc-item-key { font-weight: 700; }
.vc-item-key.if { color: var(--mod); }
.vc-item-key.then { color: var(--del); }
.vc-item-key.then.cont { color: var(--cont); }
.vc-was { position: relative; display: grid; gap: 3px; margin-block-start: 16px; padding-top: 10px; border-top: 1px solid var(--mod-line); }
.vc-was-label { position: absolute; top: -9px; left: 14px; padding: 0 8px; font-size: 0.75rem; font-weight: 600; line-height: 1.4;
  color: var(--mod); background: var(--surface); }
.vc-etc { margin: 0; padding: 12px 16px 12px calc(16px + 1.2em); background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); display: grid; gap: 4px; color: var(--muted); }
@media (max-width: 820px) { .vc-item { grid-template-columns: minmax(0, 1fr); } }

/* flow kit for html blocks: before/after panels, steps with automatic arrows, branches, ladders */
.vc-ba { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.vc-ba.wide-after { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.vc-ba.wide-before { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 860px) { .vc-ba, .vc-ba.wide-after, .vc-ba.wide-before { grid-template-columns: minmax(0, 1fr); } }
.vc-ba-panel { display: grid; gap: 16px; align-content: start; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.vc-ba-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

      var h = "<strong>" + (cur + 1) + ". " + wesc(lanes[s.f]) + " → " + wesc(lanes[s.t]) + ": " + wesc(s.label) + '</strong><div class="vc-wt-why">' + wesc(s.what) + "</div>" +
        (s.detail ? "<small>" + wesc(s.detail) + "</small>" : "") +
        (s.tasks && s.tasks.length ? '<ol class="vc-wt-tasks">' + s.tasks.map(function (t) {
          return "<li><strong>" + wesc(t.label) + "</strong>: " + wesc(t.what) + (t.detail ? "<small>" + wesc(t.detail) + "</small>" : "") + "</li>";
        }).join("") + "</ol>" : "");
      var tags = s.state ? '<span class="vc-badge ' + s.state + '">' + WT_STATE[s.state] + "</span>" : "";
      if (e.path) { tags += '<span class="vc-badge ' + (e.kind === "failure" ? "del" : "add") + '">' + (e.kind === "failure" ? "✕ " : "") + wesc(branch(e.seg).label) + " path</span>"; }
      if (tags) { h += '<div class="vc-wt-tags">' + tags + "</div>"; }
      if (e.last) {
        var b = branch(e.seg);
        h += '<div class="vc-wt-pnote">' + (b.ends ? (b.kind === "failure" ? "✕ The flow ends here in an error." : "■ The flow ends here.") : rejoins(e.seg, b) ? "↓ This path rejoins the shared flow." : "■ End of the flow.") + "</div>";
      } else if (!nxt) { h += '<div class="vc-wt-pnote">■ End of the flow.</div>'; }
      if (nxt && nxt.path && nxt.first && nxt.seg !== e.seg) {
        h += '<div class="vc-wt-choose">Next, the flow splits: ' + segs[nxt.seg].split.map(function (b) {
          return '<button type="button" class="' + b.kind + (sel[nxt.seg] === b.key ? " sel" : "") + '" data-choose="' + nxt.seg + ":" + b.key + '">→ ' + (b.kind === "failure" ? "✕ " : "") + wesc(b.label) + "</button>";
        }).join("") + "</div>";
      }
      return h;
    }
    function render() {
      var f = flat();
      cur = Math.max(0, Math.min(f.length - 1, cur));
      track.innerHTML = trackHTML(f);
      laneHost.innerHTML = lanesHTML(f);
      laneHost.querySelectorAll(".vc-wt-msg").forEach(function (m) {
        var i = +m.dataset.i;
        m.classList.toggle("cur", i === cur); m.classList.toggle("hidden", i > cur); m.classList.toggle("dim", i < cur);
      });
      laneHost.querySelectorAll(".vc-wt-box").forEach(function (b) { b.classList.toggle("hidden", +b.dataset.first > cur); });
      var s = f[cur].s;
      laneHost.querySelectorAll(".vc-wt-head span").forEach(function (h) { var k = +h.dataset.lane; h.classList.toggle("active", k === s.f || k === s.t); });
      host.querySelector('[data-a="prev"]').disabled = cur === 0;
      host.querySelector('[data-a="next"]').disabled = cur === f.length - 1;
      detail.innerHTML = detailHTML(f);
      track.querySelectorAll(".vc-wt-dot").forEach(function (d) {
        var k = indexOf(f, +d.dataset.seg, d.dataset.path || null, +d.dataset.idx);
        d.classList.toggle("done", k >= 0 && k < cur);
      });
    }
    host.addEventListener("click", function (e) {
      var b = e.target.closest("button"), m = e.target.closest(".vc-wt-msg");
      if (b && b.dataset.a === "prev") { cur--; render(); }
      else if (b && b.dataset.a === "next") { cur++; render(); }
      else if (b && b.classList.contains("vc-wt-dot")) { jump(+b.dataset.seg, b.dataset.path || null, +b.dataset.idx); }
      else if (b && b.dataset.choose) { var p = b.dataset.choose.split(":"); jump(+p[0], p[1], 0); }
      else if (m && !m.classList.contains("hidden")) { cur = +m.dataset.i; render(); }
    });
    host.addEventListener("keydown", function (e) {
      if (e.target !== host || host.closest(".vc-fs")) { return; }
      if (e.key === "ArrowRight") { cur++; render(); e.preventDefault(); } else if (e.key === "ArrowLeft") { cur--; render(); e.preventDefault(); }
    });
    // Full-window keys (the dialog's keydown handler): step forward or back, and move to the neighbouring branch of the split the
    // current step is on, keeping the position within the branch.
    host.wtKeys = {
      step: function (d) { cur += d; render(); },
      branch: function (d) {
        var c = flat()[cur];
        if (c.path === null) { return false; }
        var list = segs[c.seg].split, at = -1;
        list.forEach(function (b, k) { if (b.key === c.path) { at = k; } });
        var nb = list[at + d];
        if (!nb) { return false; }
        jump(c.seg, nb.key, Math.min(c.idx, nb.steps.length - 1));
        return true;
      }
    };
    render();
    host.setAttribute("data-wt", "ready");
  }
  root.querySelectorAll(".vc-wt").forEach(function (host) {
    try { initWalkthrough(host); } catch (err) { host.setAttribute("data-wt-error", String(err && err.message || err).slice(0, 200)); }
  });
  // A "#" link on each titled walkthrough's heading: copies the address that opens the page on that walkthrough.
  root.querySelectorAll(".vc-block[data-block]").forEach(function (block) {
    var head = block.querySelector(":scope > h3");
    if (!head) { return; }
    var a = document.createElement("a"), link = block.getAttribute("data-tab") + "/" + block.getAttribute("data-block");
    a.className = "vc-anchor"; a.href = "#" + link; a.setAttribute("aria-label", "Link to " + block.getAttribute("data-title")); a.textContent = "#";
    var msg = document.createElement("span"), timer = null;
    msg.className = "vc-anchor-msg"; msg.setAttribute("role", "status");
    function say(text, ok) {
      msg.textContent = text; a.classList.toggle("copied", ok);
      clearTimeout(timer); timer = setTimeout(function () { msg.textContent = ""; a.classList.remove("copied"); }, ok ? 2000 : 8000);
    }
    a.addEventListener("click", function (ev) {
      ev.preventDefault();
      try { history.replaceState(null, "", "#" + link); } catch (e) {}
      // A hosted page runs in a frame whose own address is not the one to share, so there the link is the fragment to add to the page address.
      var hosted = root.getAttribute("data-mode") === "artifact", text = hosted ? "#" + link : location.href;
      function done() { say(hosted ? "Copied " + text + ": add it to the page address" : "Link copied", true); }
      function fail() { say("Copy failed: " + text, false); }
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, fail); } else { fail(); }
    });
    head.appendChild(a); head.appendChild(msg);
  });
  // The full-window view follows the address: the suffix opens or closes it (Back and Forward included), and on first load
  // ?fullscreen=true on a link that names a walkthrough opens it too.
  function syncFs(firstLoad) {
    var st = hashState(), want = st.fs;
    if (firstLoad && !want) { try { want = new URL(location.href).searchParams.get("fullscreen") === "true"; } catch (e) {} }
    if (!want) { if (fs.open) { closeFs(); } return; }
    if (fs.open) { return; }
    var block = blockEl(st.tab, st.block), host = block && block.querySelector(".vc-wt");
    if (host && host.getAttribute("data-wt") === "ready") { toggleWalkthroughFs(host, host.querySelector(".vc-wt-fsbtn")); }
  }
  window.addEventListener("hashchange", function () { route(); syncFs(false); });
  window.addEventListener("popstate", function () { route(); syncFs(false); });
  syncFs(true);
})();
</script>
