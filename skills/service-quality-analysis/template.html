<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one header, a tab strip for five views, and a global control row. Each view is a full-width panel of SVG built from the embedded graph and history data. */
:root {
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #14181d;
  --ink2: #48535e;
  --muted: #6b7783;
  --line: #d9dee4;
  --grid: #e8ecf0;
  --edge-lo: #b9c2cc;
  --edge-hi: #1b2631;
  --sel: #2a78d6;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --other: #8d98a4;
  --ramp-1: #184f95; --ramp-2: #3987e5; --ramp-3: #9ec5f4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1216; --surface: #151a20; --ink: #e9edf1; --ink2: #b4bec8; --muted: #8b97a3;
    --line: #28313a; --grid: #1e252c; --edge-lo: #3a4651; --edge-hi: #dfe6ed; --sel: #3987e5;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --other: #6f7b87;
    --ramp-1: #9ec5f4; --ramp-2: #3987e5; --ramp-3: #1c5cab;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1216; --surface: #151a20; --ink: #e9edf1; --ink2: #b4bec8; --muted: #8b97a3;
  --line: #28313a; --grid: #1e252c; --edge-lo: #3a4651; --edge-hi: #dfe6ed; --sel: #3987e5;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --other: #6f7b87;
  --ramp-1: #9ec5f4; --ramp-2: #3987e5; --ramp-3: #1c5cab;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; }
h1 { font-size: 24px; line-height: 1.2; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 11px; font-weight: 600; margin: 0 0 8px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.sub { color: var(--ink2); max-width: 78ch; }
.mono { font-family: var(--font-mono); font-size: 12px; }
code { font-family: var(--font-mono); font-size: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; margin: 18px 0 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button {
  font: inherit; font-weight: 500; color: var(--ink2); background: transparent; border: 1px solid transparent;
  padding: 6px 12px; border-radius: 6px; cursor: pointer;
}
.tabs button:hover { background: var(--grid); }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--surface); border-color: var(--line); }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; color: var(--ink2); font-size: 13px; }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
select, input[type=number] {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--sel);
  border-radius: 6px; padding: 3px 6px;
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel + .panel { margin-top: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; margin-top: 14px; }
.grid2 > .panel { margin-top: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.stat .n { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { font-weight: 500; margin-top: 2px; }
.stat .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
.scroll { overflow-x: auto; }
svg { display: block; max-width: 100%; }
svg text { font-family: var(--font-ui); fill: var(--ink2); font-size: 11px; }
svg text.m { font-family: var(--font-mono); font-size: 10.5px; }
svg text.strong { fill: var(--ink); font-weight: 500; }
svg .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0 0; font-size: 12px; color: var(--ink2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; max-width: 90ch; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 8px; border-bottom: 1px solid var(--line); }
td { padding: 4px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tbody tr:nth-child(odd) { background: var(--grid); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
td.path { font-family: var(--font-mono); font-size: 12px; word-break: break-all; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }
.pill.hot { border-color: var(--edge-hi); color: var(--ink); font-weight: 500; }
#tip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px;
  border-radius: 6px; font-size: 12px; max-width: 320px; line-height: 1.35; display: none;
}
#tip b { font-weight: 600; }
#tip .mono { color: inherit; }
.guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px 18px; background: var(--grid); border-radius: 6px; padding: 10px 12px; margin-top: 10px; font-size: 12.5px; color: var(--ink2); }
.guide b { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
.guide .gnote { grid-column: 1 / -1; color: var(--muted); }
.finding { display: flex; gap: 16px; align-items: flex-start; }
.finding .fnum { font-family: var(--font-mono); font-size: 22px; font-weight: 500; color: var(--sel); min-width: 28px; line-height: 1.1; }
.finding .imp { margin-top: 8px; color: var(--ink); max-width: 90ch; }
.finding ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink2); }
.art { max-width: 760px; margin: 0 auto; padding-block: 8px 16px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.art-title { font-size: 28px; line-height: 1.2; margin: 0 0 12px; text-wrap: balance; letter-spacing: -0.01em; }
.art p { font-size: 15px; line-height: 1.7; color: var(--ink); max-width: 70ch; margin: 0; }
.art p.lede { font-size: 17px; line-height: 1.6; color: var(--ink2); }
.art-sec { margin-top: 36px; }
.art-sec h2 { font-size: 20px; margin: 0 0 8px; }
.art a { color: var(--sel); text-underline-offset: 2px; }
figure.mini { margin: 16px 0 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
figure.mini figcaption { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
figure.mini figcaption .legend { margin: 0 0 6px; }
.art-aside { margin-top: 40px; padding: 14px 16px; background: var(--grid); border-radius: 8px; }
.art-aside ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.6; color: var(--ink2); }
.art-aside p { margin-top: 10px; }
.split { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.splitmain { flex: 1 1 520px; min-width: 0; }
.splitside { flex: 0 1 340px; min-width: 0; }
.splitside .guide { margin-top: 0; grid-template-columns: 1fr; }
section[hidden] { display: none; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

<div class="wrap">
  <h1 id="h1"></h1>
  <p class="sub" id="lede"></p>

  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="controls">
      <label for="binSel">Highlight binary
        <select id="binSel"><option value="">none</option></select>
      </label>
      <label for="tSel">Cross-subtree at tree distance ≥
        <select id="tSel"></select>
      </label>
      <label for="mockChk"><input type="checkbox" id="mockChk"> include mocks &amp; test helpers</label>
    </div>
  </div>

  <section id="view-overview" hidden></section>
  <section id="view-analysis" hidden></section>
  <section id="view-suggestions" hidden></section>
  <section id="view-scorecard" hidden></section>
  <section id="view-forest" hidden></section>
  <section id="view-dsm" hidden></section>
  <section id="view-matrix" hidden></section>
  <section id="view-graph" hidden></section>
  <section id="view-bundle" hidden></section>
  <section id="view-churn" hidden></section>
</div>
<div id="tip"></div>

<script>
const D = /*__DATA__*/null;
const SUBJ = D.meta.subject;

const ALL_TABS = [
  ["overview", "Overview"], ["analysis", "Analysis"], ["suggestions", "Suggestions"], ["scorecard", "Scorecard"], ["forest", "Forest"], ["dsm", "Dependency matrix"],
  ["matrix", "Binary × package"], ["graph", "Import graph"], ["bundle", "Directory vs dependency"], ["churn", "Size & churn"],
];
const HAS_BINS = Object.keys(D.binaries).length > 0;
const TAB_ON = { analysis: !!(D.narrative && D.narrative.analysis), suggestions: !!(D.narrative && D.narrative.suggestions), forest: HAS_BINS, matrix: HAS_BINS, churn: D.churn.available };
const TABS = ALL_TABS.filter(([id]) => TAB_ON[id] !== false);
const state = { T: 4, mocks: false, binary: "", tab: "overview" };
const $ = (s, r = document) => r.querySelector(s);
const fmt = d3.format(",");
const short = b => (D.meta.short && D.meta.short[b]) || b;
const label = id => id.replace(/^internal\//, "");
const groupOf = id => id === "(root)" ? "(root)" : (id.startsWith("internal/") ? id.split("/")[1] : id.split("/")[0]);

/* ---------- derived model ---------- */
const byId = new Map(D.packages.map(p => [p.id, p]));
const binIds = Object.keys(D.binaries).sort();
const directBin = new Map(binIds.map(b => [b, new Set(byId.get(b).imports)]));

const groupLoc = d3.rollup(D.packages.filter(p => p.kind === "code"), v => d3.sum(v, p => p.loc), p => groupOf(p.id));
const groupOrder = [...groupLoc].sort((a, b) => b[1] - a[1]).map(d => d[0]);
const groupColor = g => { const i = groupOrder.indexOf(g); return i >= 0 && i < 8 ? `var(--c${i + 1})` : "var(--other)"; };

function model() {
  const ok = p => p.kind === "code" || (state.mocks && (p.kind === "mock" || p.kind === "test"));
  const nodes = D.packages.filter(ok);
  const ids = new Set(nodes.map(p => p.id));
  const edges = D.edges.filter(e => ids.has(e.s) && ids.has(e.t));
  const useCount = new Map(nodes.map(p => [p.id, 0]));
  for (const b of binIds) for (const id of D.binaries[b]) if (useCount.has(id)) useCount.set(id, useCount.get(id) + 1);
  const fin = new Map(nodes.map(p => [p.id, 0])), fout = new Map(nodes.map(p => [p.id, 0]));
  for (const e of edges) { fin.set(e.t, fin.get(e.t) + 1); fout.set(e.s, fout.get(e.s) + 1); }
  return { nodes, ids, edges, useCount, fin, fout, cross: edges.filter(e => e.d >= state.T) };
}
const closureSet = () => state.binary ? new Set(D.binaries[state.binary]) : null;

/* ---------- helpers ---------- */
const tip = $("#tip");
function showTip(ev, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => { tip.style.display = "none"; };
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
function pkgTip(p, m) {
  return `<b class="mono">${label(p.id)}</b><br>${fmt(p.loc)} LOC · ${p.files} files<br>fan-in ${m ? m.fin.get(p.id) : p.fan_in} · fan-out ${m ? m.fout.get(p.id) : p.fan_out}${D.churn.available ? `<br>${p.commits} commits since ${D.churn.after}` : ""}`;
}
function legendHTML() {
  const used = groupOrder.slice(0, 8);
  return `<div class="legend">${used.map(g => `<span><i class="sw" style="background:${groupColor(g)}"></i>${g}</span>`).join("")}${groupOrder.length > 8 ? `<span><i class="sw" style="background:var(--other)"></i>other (${groupOrder.length - 8} dirs)</span>` : ""}</div>`;
}
function svgIn(host, w, h) {
  return d3.select(host).append("svg").attr("viewBox", `0 0 ${w} ${h}`).attr("width", w).attr("height", h).attr("role", "img");
}
const hostWidth = (host, max = 1100) => Math.max(320, Math.min(max, host.clientWidth || 1000));

/* ---------- overview ---------- */
function renderOverview(root) {
  const m = model();
  const loc = d3.sum(m.nodes, p => p.loc);
  const nCross = m.cross.length;
  const covered = m.nodes.filter(p => m.useCount.get(p.id) > 0);
  const shared4 = covered.filter(p => m.useCount.get(p.id) >= 4);
  const sharedLoc = d3.sum(shared4, p => p.loc), coveredLoc = d3.sum(covered, p => p.loc);
  const hidden = D.churn.pairs.filter(p => !p.linked && byId.get(p.a)?.kind === "code" && byId.get(p.b)?.kind === "code");
  const medianD = d3.median(m.edges, e => e.d);
  root.innerHTML = `
    <div class="panel">
      <div class="stats">
        ${binIds.length ? `<div class="stat"><div class="n">${binIds.length}</div><div class="l">entry points</div><div class="d">${D.meta.entry_desc}</div></div>` : ""}
        <div class="stat"><div class="n">${m.nodes.length}</div><div class="l">packages · ${fmt(loc)} LOC</div><div class="d">non-test code, excluding mocks unless toggled</div></div>
        <div class="stat"><div class="n">${Math.round(100 * nCross / Math.max(1, m.edges.length))}%</div><div class="l">${nCross} of ${m.edges.length} imports cross subtrees</div><div class="d">tree distance ≥ ${state.T}; median edge spans ${medianD} hops</div></div>
        ${binIds.length ? `<div class="stat"><div class="n">${Math.round(100 * sharedLoc / Math.max(1, coveredLoc))}%</div><div class="l">of deployed LOC shared by 4+ binaries</div><div class="d">${shared4.length} of ${covered.length} reachable packages</div></div>` : ""}
        ${D.churn.available ? `<div class="stat"><div class="n">${hidden.length}</div><div class="l">co-changing pairs with no import</div><div class="d">changed together ≥3 times in ${D.churn.commits_touching_subject} commits to ${SUBJ}</div></div>` : ""}
      </div>
    </div>
    <div class="grid2">
      ${binIds.length ? `<div class="panel"><h2>What each binary drags in</h2>
        <p class="sub">Transitive in-module closure per binary, split by how many binaries use each package. The legend shows which shade means only this binary uses a package.</p>
        <div id="ovFoot" style="margin-top:10px"></div></div>` : ""}
      <div class="panel"><h2>How far imports travel</h2>
        <p class="sub">Imports by tree distance: directory hops through the common ancestor. Distance 1 is parent to child; long edges are the ones that cut across the layout.</p>
        <div id="ovDist" style="margin-top:10px"></div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Most depended on</h2><p class="sub">Highest fan-in. A change here touches every importer.</p><div id="ovIn" style="margin-top:10px"></div></div>
      <div class="panel"><h2>Widest reach</h2><p class="sub">Highest fan-out. These packages know about the most others.</p><div id="ovOut" style="margin-top:10px"></div></div>
    </div>
    <div class="panel" style="margin-top:14px"><h3>How the numbers are defined</h3>
      <p class="note" style="margin-top:0">Packages are the directories that hold code. An import is a file-level import edge from the graphify graph (<code>graphify-out/graph.json</code>) rolled up to directories; binary closures follow those imports from each entry point. Tree distance between two packages is the number of directory hops up to their lowest common ancestor and back down. Fan-in counts packages that import this one; fan-out counts packages it imports. Churn counts ${D.churn.vcs} commits since ${D.churn.after} that touched a non-test source file in the package. Co-change pairs skip ${D.churn.cochange_skipped_big_commits} sweeping commits that touched more than 25 packages. Test-only imports are excluded from edges.</p></div>`;
  if (binIds.length) footprint($("#ovFoot", root), m);
  distHist($("#ovDist", root), m);
  rankList($("#ovIn", root), m, m.fin);
  rankList($("#ovOut", root), m, m.fout);
}
function footprint(host, m) {
  const rows = binIds.map(b => {
    const ids = D.binaries[b].filter(id => m.ids.has(id) && byId.get(id).kind !== "cmd");
    const part = { one: 0, mid: 0, many: 0 };
    for (const id of ids) { const c = m.useCount.get(id), l = byId.get(id).loc; part[c <= 1 ? "one" : c <= 3 ? "mid" : "many"] += l; }
    return { b, n: ids.length, ...part, total: part.one + part.mid + part.many };
  }).sort((a, b) => b.total - a.total);
  const w = hostWidth(host, 560), lw = 136, rw = 150, h = rows.length * 24 + 8;
  const x = d3.scaleLinear([0, d3.max(rows, r => r.total)], [0, w - lw - rw]);
  const svg = svgIn(host, w, h);
  rows.forEach((r, i) => {
    const y = i * 24 + 4, g = svg.append("g").attr("transform", `translate(0,${y})`);
    if (i % 2 === 0) g.append("rect").attr("x", 0).attr("y", -2).attr("width", w).attr("height", 24).attr("rx", 4).style("fill", "var(--grid)").attr("opacity", 0.7);
    g.append("text").attr("class", "m strong").attr("x", lw - 8).attr("y", 13).attr("text-anchor", "end").text(short(r.b));
    let acc = 0;
    [["one", "var(--ramp-1)"], ["mid", "var(--ramp-2)"], ["many", "var(--ramp-3)"]].forEach(([k, c]) => {
      const wd = x(r[k]);
      if (wd > 0) g.append("rect").attr("x", lw + x(acc)).attr("y", 2).attr("width", Math.max(0, wd - 2)).attr("height", 16).attr("rx", 3).style("fill", c)
        .on("mousemove", ev => showTip(ev, `<b>${short(r.b)}</b><br>${fmt(r[k])} LOC in packages used by ${k === "one" ? "only this binary" : k === "mid" ? "2-3 binaries" : "4+ binaries"}`)).on("mouseleave", hideTip);
      acc += r[k];
    });
    g.append("text").attr("class", "m").attr("x", lw + x(r.total) + 6).attr("y", 14).text(`${fmt(r.total)} · ${r.n} pkg`);
  });
  host.insertAdjacentHTML("beforeend", `<div class="legend"><span><i class="sw" style="background:var(--ramp-1)"></i>only this binary</span><span><i class="sw" style="background:var(--ramp-2)"></i>shared by 2-3</span><span><i class="sw" style="background:var(--ramp-3)"></i>shared by 4+</span></div>`);
}
function distHist(host, m) {
  const counts = d3.rollup(m.edges, v => v.length, e => e.d);
  const ds = d3.range(1, (d3.max(m.edges, e => e.d) || 1) + 1);
  const w = hostWidth(host, 560), h = 190, ml = 34, mb = 26;
  const x = d3.scaleBand(ds, [ml, w - 8]).padding(0.15), y = d3.scaleLinear([0, d3.max(ds, d => counts.get(d) || 0)], [h - mb, 8]);
  const svg = svgIn(host, w, h);
  svg.append("g").selectAll("line").data(y.ticks(4)).join("line").attr("x1", ml).attr("x2", w - 8).attr("y1", y).attr("y2", y).style("stroke", "var(--grid)");
  svg.append("g").selectAll("text").data(y.ticks(4)).join("text").attr("x", ml - 6).attr("y", d => y(d) + 4).attr("text-anchor", "end").text(d => d);
  svg.selectAll("rect.b").data(ds).join("rect").attr("class", "b").attr("x", d => x(d)).attr("width", x.bandwidth())
    .attr("y", d => y(counts.get(d) || 0)).attr("height", d => y(0) - y(counts.get(d) || 0)).attr("rx", 3)
    .style("fill", d => d >= state.T ? "var(--edge-hi)" : "var(--edge-lo)")
    .on("mousemove", (ev, d) => showTip(ev, `<b>${counts.get(d) || 0} imports</b> at tree distance ${d}`)).on("mouseleave", hideTip);
  svg.append("g").selectAll("text").data(ds).join("text").attr("x", d => x(d) + x.bandwidth() / 2).attr("y", h - 8).attr("text-anchor", "middle").text(d => d);

/* ---------- directory vs dependency ---------- */
function buildTree(pkgs) {
  const root = { name: SUBJ, children: [], path: "" };
  const at = new Map([["", root]]);
  const sorted = [...pkgs].sort((a, b) => d3.ascending(a.id, b.id));
  const hasKids = new Set();
  for (const p of sorted) { const s = p.id.split("/"); for (let i = 1; i < s.length; i++) hasKids.add(s.slice(0, i).join("/")); }
  for (const p of sorted) {
    const segs = p.id === "(root)" ? ["(root)"] : p.id.split("/");
    let parent = root, path = "";
    segs.forEach((seg, i) => {
      path = path ? path + "/" + seg : seg;
      const last = i === segs.length - 1;
      if (last && !hasKids.has(p.id)) { const n = { name: seg, id: p.id, pkg: p, path }; parent.children.push(n); at.set("leaf:" + p.id, n); }
      else {
        let n = at.get(path);
        if (!n) { n = { name: seg, children: [], path }; parent.children.push(n); at.set(path, n); }
        if (last) { const leaf = { name: seg + " ·", id: p.id, pkg: p, path: path + "/·" }; n.children.push(leaf); at.set("leaf:" + p.id, leaf); }
        parent = n;
      }
    });
  }
  return { root, at };
}

    .attr("r", p => 3 + Math.sqrt(p.loc) / 9).style("fill", p => groupColor(groupOf(p.id))).attr("fill-opacity", 0.75).style("stroke", "var(--surface)").attr("stroke-width", 1.2)
    .on("mousemove", (ev, p) => showTip(ev, `<b class="mono">${label(p.id)}</b><br>I ${f2(p.i)} (in ${p.ca}, out ${p.ce})<br>A ${f2(p.a)} (${p.ifaces} of ${p.types} types)<br>D ${f2(p.d)}`)).on("mouseleave", hideTip);
  host.insertAdjacentHTML("beforeend", `<p class="note">${pts.length} of ${codePk.length} packages plotted; ${skipped} have no imports in or out, or no type declarations, so I or A is undefined.</p>`);
}

/* ---------- analysis & suggestions (article layout) ---------- */
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const go = (tab, text) => `<a href="#${tab}" data-go="${tab}">${text}</a>`;
function miniBars(rows, { w = 520, lw = 150, fmtv = v => v, max } = {}) {
  const rh = 20, h = rows.length * rh + 4, mx = max ?? (d3.max(rows, r => d3.sum(r.segs, s => s.v)) || 1);
  const x = v => (w - lw - 120) * v / mx;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">${rows.map((r, i) => {
    let acc = 0; const y = i * rh + 2, tot = d3.sum(r.segs, s => s.v);
    const band = i % 2 === 0 ? `<rect x="0" y="${y - 1}" width="${w}" height="${rh}" rx="3" style="fill:var(--grid)" opacity="0.6"/>` : "";
    const segs = r.segs.map(s => { const sx = lw + x(acc); acc += s.v; return s.v > 0 ? `<rect x="${sx}" y="${y + 3}" width="${Math.max(1, x(s.v) - 1.5)}" height="13" rx="3" style="fill:${s.fill}"><title>${esc(r.label)}: ${esc(s.name || "")} ${fmtv(s.v)}</title></rect>` : ""; }).join("");
    return `${band}<text class="m strong" x="${lw - 8}" y="${y + 13}" text-anchor="end">${esc(r.label)}</text>${segs}<text class="m" x="${lw + x(tot) + 6}" y="${y + 13}">${r.note ?? fmtv(tot)}</text>`;
  }).join("")}</svg>`;
}
function miniPips(items, n) {
  const w = 520, lw = 230, rh = 24, h = items.length * rh + 22, x = i => lw + 14 + i * ((w - lw - 100) / (n - 1));
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"><text class="m" x="${x(0)}" y="12" text-anchor="middle">best</text><text class="m" x="${x(n - 1)}" y="12" text-anchor="middle">worst</text>${items.map((it, r) => {
    const y = 26 + r * rh;
    const band = r % 2 === 0 ? `<rect x="0" y="${y - 12}" width="${w}" height="${rh}" rx="3" style="fill:var(--grid)" opacity="0.6"/>` : "";
    return `${band}<text class="strong" x="${lw - 8}" y="${y + 4}" text-anchor="end">${esc(it.name)}</text>${d3.range(n).map(i => `<circle cx="${x(i)}" cy="${y}" r="${i === it.rank ? 7 : 4.5}" style="fill:${i === it.rank ? "var(--sel)" : "var(--other)"}"/>`).join("")}<text class="m" x="${w - 4}" y="${y + 4}" text-anchor="end">${esc(it.value)}</text>`;
  }).join("")}</svg>`;
}
function miniDots(rows, { w = 520, lw = 150, fmtv = f2 } = {}) {
  const rh = 20, h = rows.length * rh + 4, lo = d3.min(rows, r => r.v), hi = d3.max(rows, r => r.v);
  const x = v => lw + 10 + (w - lw - 70) * (v - lo) / ((hi - lo) || 1);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">${rows.map((r, i) => {
    const y = i * rh + 12;
    const band = i % 2 === 0 ? `<rect x="0" y="${y - 10}" width="${w}" height="${rh}" rx="3" style="fill:var(--grid)" opacity="0.6"/>` : "";
    return `${band}<text class="m ${r.hi ? "strong" : ""}" x="${lw - 8}" y="${y + 4}" text-anchor="end">${esc(r.label)}</text><line x1="${lw + 10}" x2="${x(r.v)}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><circle cx="${x(r.v)}" cy="${y}" r="${r.hi ? 6.5 : 4.5}" style="fill:${r.hi ? "var(--sel)" : "var(--other)"}"/><text class="m" x="${x(r.v) + 10}" y="${y + 4}">${fmtv(r.v)}</text>`;
  }).join("")}</svg>`;
}
const fig = (svg, caption) => `<figure class="mini"><div class="scroll">${svg}</div><figcaption>${caption}</figcaption></figure>`;
const keyTxt = items => `<div class="legend">${items.map(([c, t]) => `<span><i class="sw" style="background:${c}"></i>${t}</span>`).join("")}</div>`;

const fmtMeasure = k => MEASURES.find(c => c.key === k).f;
function figRanks(F) {
  const items = F.ranks.filter(r => r.rank != null && r.value != null).map(r => ({ name: r.name, rank: r.rank, value: fmtMeasure(r.key)(r.value), of: r.of }));
  if (!items.length) return "";
  return fig(miniPips(items, d3.max(items, i => i.of)), `${SUBJ}'s position (blue) among ${F.n_peers} comparable units on each measure. Details on the ${go("scorecard", "Scorecard")}.`);
}
function figShare(F) {
  if (!F.share_rows.length) return "";
  return fig(miniBars(F.share_rows.map(r => ({ label: short(r.b), segs: [{ v: r.s, fill: "var(--ramp-3)", name: "shared" }, { v: r.own, fill: "var(--ramp-1)", name: "own" }], note: pct(r.pct) + " shared" }))),
    `${keyTxt([["var(--ramp-3)", "also imported by another binary"], ["var(--ramp-1)", "only this binary"]])}Packages each binary imports. See the ${go("forest", "Forest")} and ${go("matrix", "Binary × package")} tabs.`);
}
function figUse(F) {
  const rows = F.binary_rows.filter(r => r.called != null);
  if (!rows.length) return "";
  return fig(miniBars(rows.map(r => ({ label: short(r.b), segs: [{ v: r.called, fill: "var(--sel)", name: "called" }, { v: r.init, fill: "var(--c4)", name: "init only" }, { v: r.gone, fill: "var(--other)", name: "eliminated" }], note: `${r.init} init only` }))),
    `${keyTxt([["var(--sel)", "called"], ["var(--c4)", "linked, init only"], ["var(--other)", "eliminated by the linker"]])}What happens to each binary's imported packages once linked. From the cost table on the ${go("forest", "Forest")} tab.`);
}
function figHub(F) {
  const a = F.hub;
  if (!a) return "";
  const nm = label(a.id).split("/").slice(-2).join("/");
  const m = [["lines of code", a.loc, a.next_loc, "loc"], ["packages imported", a.fan_out, a.next_out, "fan_out"]];
  if (D.churn.available) m.push([`commits, ${D.churn.months} months`, a.commits, a.next_churn, "commits"]);
  const rows = m.filter(([, av, next]) => av > 0 && next).flatMap(([name, av, next, key]) => [
    { label: `${name}: ${nm}`, segs: [{ v: 1, fill: "var(--c1)" }], note: fmt(av) },
    { label: `next: ${label(next.id).split("/").slice(-2).join("/")}`, segs: [{ v: next[key] / av, fill: "var(--other)" }], note: fmt(next[key]) }]);
  if (!rows.length) return "";
  return fig(miniBars(rows, { lw: 250, w: 560, max: 1 }),
    `<code>${label(a.id)}</code> against the runner-up on each measure. Explore it on ${go("overview", "Overview")}${D.churn.available ? ` and ${go("churn", "Size & churn")}` : ""}.`);
}
function figMisfit(F) {
  if (!F.misfit.length) return "";
  return fig(miniBars(F.misfit.map(p => ({ label: label(p.id), segs: [{ v: Math.round(p.fit * p.deg), fill: "var(--sel)", name: "in own directory" }, { v: p.deg - Math.round(p.fit * p.deg), fill: "var(--other)", name: "elsewhere" }], note: `${pct(p.fit)} at home` })), { lw: 190 }),
    `${keyTxt([["var(--sel)", "import neighbours in its own directory"], ["var(--other)", "neighbours elsewhere"]])}From "packages least at home" on the ${go("scorecard", "Scorecard")}.`);
}
function figHidden(F) {
  if (!F.hidden.length) return "";
  return fig(miniBars(F.hidden.slice(0, 5).map(p => ({ label: `${p.a.split("/").pop()} ↔ ${p.b.split("/").pop()}`, segs: [{ v: p.n, fill: "var(--c2)" }], note: `${p.n} commits` })), { lw: 230 }),
    `Package pairs that changed together with no import between them. Full list on ${go("churn", "Size & churn")}.`);
}
function figDepth(F) {
  if (F.depth.length < 2) return "";
  return fig(miniDots(F.depth), `Average directory depth of a package, per unit. The import side of this is on the ${go("bundle", "Directory vs dependency")} and ${go("dsm", "Dependency matrix")} tabs.`);
}
function figCore(F) {
  if (!F.core.length) return "";
  return fig(miniBars(F.core.slice(0, 10).map(([p, n]) => ({ label: label(p), segs: [{ v: n, fill: "var(--ramp-3)" }], note: `${n} binaries` })), { lw: 210, max: binIds.length }),
    `Packages that ${F.core_min} or more binaries ${F.core_basis === "linker" ? "actually call, by the linker's account" : "import, directly or through others"}: the natural shared core.`);
}
function figDeep(F) {
  if (!F.deepest.length) return "";
  return fig(miniBars(F.deepest.map(p => ({ label: label(p.id).split("/").slice(-2).join("/"), segs: [{ v: p.d, fill: "var(--other)" }], note: `${p.d} levels` })), { lw: 210, max: d3.max(F.deepest, p => p.d) }),
    `The most deeply nested packages. Full paths on the ${go("bundle", "Directory vs dependency")} tab.`);
}
const FIGS = { ranks: figRanks, share: figShare, use: figUse, hub: figHub, misfit: figMisfit, hidden: figHidden, depth: figDepth, core: figCore, deep: figDeep };
const rich = s => String(s).replace(/\{\{go:(\w+)\|([^}]+)\}\}/g, (_, t, x) => go(t, x));
function renderArticle(root, mode) {
  const N = D.narrative[mode], F = D.facts;
  const sec = s => `<section class="art-sec"><h2>${s.title}</h2>${(s.paras || []).map(p => `<p>${rich(p)}</p>`).join("")}${(s.figs || []).map(k => (FIGS[k] ? FIGS[k](F) : "")).join("")}</section>`;
  const aside = N.aside ? `<aside class="art-aside"><h3>${N.aside.title}</h3><ul>${N.aside.items.map(i => `<li>${rich(i)}</li>`).join("")}</ul>${N.aside.next ? `<p>${rich(N.aside.next)}</p>` : ""}</aside>` : "";
  root.innerHTML = `<div class="panel"><article class="art"><header class="art-head"><p class="eyebrow">${N.eyebrow || (mode === "analysis" ? "Analysis" : "Suggestions")}</p><h1 class="art-title">${N.title}</h1><p class="lede">${rich(N.lede)}</p></header>${N.sections.map(sec).join("")}${aside}</article></div>`;
  root.onclick = e => {
    const a = e.target.closest("a[data-go]"); if (!a) return;
    e.preventDefault(); state.tab = a.dataset.go;
    try { history.replaceState(null, "", "#" + state.tab); } catch (_) {}
    rerender(); window.scrollTo({ top: 0 });
  };
}

/* ---------- wiring ---------- */
const CONTROL_TABS = {
  binSel: ["forest", "matrix", "graph", "bundle", "churn"],
  tSel: ["overview", "graph", "bundle"],
  mockChk: ["overview", "matrix", "graph", "bundle", "churn"],
};
const renderers = { overview: renderOverview, analysis: root => renderArticle(root, "analysis"), suggestions: root => renderArticle(root, "suggestions"), scorecard: renderScorecard, forest: renderForest, dsm: renderDsm, matrix: renderMatrix, graph: renderGraph, bundle: renderBundle, churn: renderChurn };
function rerender() {
  for (const [id] of TABS) $("#view-" + id).hidden = id !== state.tab;
  $("#tabs").querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
  hideTip();
  for (const [id, tabs] of Object.entries(CONTROL_TABS)) document.querySelector(`label[for="${id}"]`).hidden = !tabs.includes(state.tab) || (id === "binSel" && !HAS_BINS);
  const host = $("#view-" + state.tab); host.innerHTML = "";
  renderers[state.tab](host);
}
function init() {
  $("#h1").textContent = D.meta.title;
  $("#lede").textContent = `${SUBJ}: ${binIds.length ? binIds.length + " entry points, " : ""}${D.packages.filter(p => p.kind === "code").length} packages, ${D.edges.length} import edges. Built from the graphify graph${D.churn.available ? ` and ${D.churn.vcs} history since ${D.churn.after}` : ""}.`;
  $("#tabs").innerHTML = TABS.map(([id, t]) => `<button role="tab" data-tab="${id}" aria-selected="false">${t}</button>`).join("");
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (b) { state.tab = b.dataset.tab; try { history.replaceState(null, "", "#" + state.tab); } catch (_) {} rerender(); } };
  $("#binSel").insertAdjacentHTML("beforeend", binIds.map(b => `<option value="${b}">${short(b)}</option>`).join(""));
  $("#binSel").onchange = e => { state.binary = e.target.value; rerender(); };
  $("#tSel").innerHTML = [2, 3, 4, 5, 6, 7].map(v => `<option value="${v}">${v}</option>`).join("");
  $("#tSel").value = String(state.T); $("#tSel").onchange = e => { state.T = +e.target.value; rerender(); };
  $("#mockChk").onchange = e => { state.mocks = e.target.checked; rerender(); };
  const h = (location.hash || "").slice(1);
  if (TABS.some(([id]) => id === h)) state.tab = h;
  rerender();
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(rerender, 180); });
}
init();
</script>
